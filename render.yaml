services:
  # 1. Backend Web Service (Spring Boot 3 + Aiven PostgreSQL via Docker)
  - type: web
    name: utubehub-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: aiven
      - key: AIVEN_PG_HOST
        value: pg-2ff57b18-alagesan-0eb8.b.aivencloud.com
      - key: AIVEN_PG_PORT
        value: "15331"
      - key: AIVEN_PG_DATABASE
        value: utubehub
      - key: AIVEN_PG_USER
        value: avnadmin
      - key: AIVEN_PG_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,https://utubehub-frontend.onrender.com

  # 2. Frontend Static Site (Vite React 18 -> https://utubehub-frontend.onrender.com)
  - type: web
    name: utubehub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://utubehub-backend.onrender.com/api
